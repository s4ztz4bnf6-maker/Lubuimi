name: Kolaz threshold-return reproducibility

on:
  push:
    paths:
      - "projects/LubuimiKolazThresholdReturn/**"
      - ".github/workflows/kolaz-threshold-return.yml"
  pull_request:
    paths:
      - "projects/LubuimiKolazThresholdReturn/**"
      - ".github/workflows/kolaz-threshold-return.yml"

jobs:
  exact-finite-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact table and confluence tests
        run: |
          cd projects/LubuimiKolazThresholdReturn
          python -m unittest -v test_threshold_return.py
      - name: Print reproducible finite tables
        run: |
          cd projects/LubuimiKolazThresholdReturn
          python threshold_return.py
