name: BBMST Lean audit compile

on:
  push:
    branches:
      - audit/lean4-erdos-selfridge
  pull_request:
  workflow_dispatch:

jobs:
  compile-bbmst-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and generate lake manifest
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Install dependencies and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Compile the audited formalization
        run: lake env lean ErdosSelfridge_v17_fixed.lean
      - name: Compile the endpoint-safe fiber mass core
        run: lake env lean BBMSTFiberMassCore.lean
