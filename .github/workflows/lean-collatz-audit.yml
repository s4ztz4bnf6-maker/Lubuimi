name: Collatz draft Lean compile audit

on:
  push:
    branches:
      - collatz/compiler-audit-2026-10-19
      - collatz/quarter-descent-lemma-2026-10-20
      - collatz/offset-margin-roadmap-2026-10-23
      - collatz/lean-435-recheck-2026-10-24
      - collatz/weighted-correction-expansion-2026-10-25
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  compile-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0 and generate lake manifest
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Install dependencies and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Build Lean library modules
        run: lake build CollatzAudit
      - name: Compile IterationLemmas.lean
        run: lake env lean IterationLemmas.lean
      - name: Compile ThresholdLemmas.lean
        run: lake env lean ThresholdLemmas.lean
      - name: Compile SyracuseReferenceTest.lean
        run: lake env lean SyracuseReferenceTest.lean
      - name: Compile SyracuseQuarterDescent.lean
        run: lake env lean SyracuseQuarterDescent.lean
      - name: Compile and export offset identity plus strict-margin consequence
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/SyracuseOffsetIdentity.olean SyracuseOffsetIdentity.lean
      - name: Compile exact threshold margin characterization
        run: lake env lean SyracuseThresholdMargin.lean
      - name: Compile and audit stronger offset lower bound
        run: lake env lean SyracuseOffsetLowerBound.lean
      - name: Compile weighted correction expansion and local sign classification
        run: lake env lean SyracuseWeightedCorrection.lean
      - name: Attempt sandbox-based independent recheck
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          lake check
