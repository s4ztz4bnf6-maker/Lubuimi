name: Collatz draft Lean compile audit

on:
  push:
    branches:
      - collatz/compiler-audit-2026-10-19
      - collatz/quarter-descent-lemma-2026-10-20
      - collatz/syracuse-quarter-bridge-2026-10-21
  pull_request:
  workflow_dispatch:

jobs:
  compile-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and generate lake manifest
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Install dependencies and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Build Lean library modules
        run: lake build CollatzAudit
      - name: Compile IterationLemmas.lean
        run: lake env lean IterationLemmas.lean
      - name: Compile ThresholdLemmas.lean
        run: lake env lean ThresholdLemmas.lean
      - name: Compile SyracuseReferenceTest.lean
        run: lake env lean SyracuseReferenceTest.lean -o .lake/build/lib/lean/SyracuseReferenceTest.olean
      - name: Compile SyracuseQuarterDescent.lean
        run: lake env lean SyracuseQuarterDescent.lean
      - name: Compile and audit SyracuseSecondStep.lean
        run: |
          lake env lean SyracuseSecondStep.lean 2>&1 | tee /tmp/syracuse-second-step-audit.log
          if grep -q 'sorryAx' /tmp/syracuse-second-step-audit.log; then
            echo "Forbidden sorryAx dependency detected"
            exit 1
          fi
