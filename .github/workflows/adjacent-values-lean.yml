name: Adjacent Values — Lean kernel checks

on:
  push:
    branches:
      - research/adjacent-values-independent-track-2026-11-18
    paths:
      - "AdjacentValues/**"
      - ".github/workflows/adjacent-values-lean.yml"
  pull_request:
    paths:
      - "AdjacentValues/**"
      - ".github/workflows/adjacent-values-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdjacentValues
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and selected Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib dependency
        run: lake update
      - name: Download Mathlib build cache
        run: lake exe cache get
      - name: Build Lean library
        run: lake build
      - name: Reject placeholders, native_decide and project axioms
        shell: bash
        run: |
          set -o pipefail
          if find . -path './.lake' -prune -o -name '*.lean' -print0 |
             xargs -0 -r grep -n -E '(^|[^[:alnum:]_])(sorry|sorryAx|native_decide)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]'; then
            echo "ERROR: forbidden placeholder, native_decide, or project axiom found"
            exit 1
          fi
      - name: Run declaration-level axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axiom-audit.txt
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          output = Path("axiom-audit.txt").read_text()
          matches = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", output)
          if not matches:
              print("ERROR: no '#print axioms' result found")
              sys.exit(1)

          allowed = {"propext", "Classical.choice", "Quot.sound"}
          failed = False
          for raw in matches:
              actual = {x.strip() for x in raw.split(",") if x.strip()}
              extra = actual - allowed
              print(f"Axiom dependencies: {sorted(actual)}")
              if extra:
                  print(f"ERROR: disallowed axioms: {sorted(extra)}")
                  failed = True
          if failed:
              sys.exit(1)
          PY
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adjacent-values-lean-audit
          path: AdjacentValues/axiom-audit.txt
          if-no-files-found: ignore
